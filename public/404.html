<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>…</title>
    <script>
      // GitHub Pages serves 404.html for deep links. Stash the requested path and
      // bounce to index.html, which restores it before React Router mounts.
      (function () {
        var segments = 1; // repository name in the path (set to 0 for a custom domain at the root)
        var l = window.location;
        var path = l.pathname.split('/').slice(1 + segments).join('/');
        var target =
          l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + segments).join('/') + '/?redirect=/' +
          path + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
