<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Sound &amp; DJ Equipment Rental</title>
    <meta name="description" content="Professional sound, DJ and event equipment rental." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the deep link stashed by 404.html before the router boots.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          params.delete('redirect');
          var query = params.toString();
          history.replaceState(
            null,
            '',
            window.location.pathname.replace(/\/$/, '') + redirect + (query ? '?' + query : '') + window.location.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
